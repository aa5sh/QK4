name: Release

# WHY a dynamic run-name: a dispatch rehearsal and a real tagged release are the
# same workflow, so both used to appear in the Actions list titled just "Release".
# That made a rehearsal indistinguishable at a glance from something that shipped.
run-name: >-
  ${{ github.event_name == 'push'
      && format('Release {0}', github.ref_name)
      || format('Rehearsal (publishes nothing) — {0}', github.ref_name) }}

# Tagged release: builds all three platforms via the shared _build-*.yml reusable
# workflows, publishes a GitHub Release, and updates the gh-pages download page.
#
# workflow_dispatch runs the SAME build and packaging path as a rehearsal, then
# stops before Create Release and publish. That makes the release path testable
# without minting a tag or touching gh-pages. A dispatch can never publish —
# publishing is gated on the event being a tag push, not on a user-supplied flag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, never cancelled mid-notarization.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Derive version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.derive.outputs.version }}
      is_release: ${{ steps.derive.outputs.is_release }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Derive version
        id: derive
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IS_RELEASE=true
          else
            VERSION="dryrun-$(git rev-parse --short HEAD)"
            IS_RELEASE=false
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "version=$VERSION is_release=$IS_RELEASE"

  macos:
    needs: version
    uses: ./.github/workflows/_build-macos.yml
    with:
      version: ${{ needs.version.outputs.version }}
      retention-days: 30
    secrets: inherit

  windows:
    needs: version
    uses: ./.github/workflows/_build-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}
      retention-days: 30
    secrets: inherit

  raspberry-pi:
    needs: version
    uses: ./.github/workflows/_build-pi.yml
    with:
      version: ${{ needs.version.outputs.version }}
      retention-days: 30
    secrets: inherit

  release:
    needs: [version, macos, windows, raspberry-pi]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Install git-cliff
        # Pinned so release-notes formatting can't change between releases
        # without a deliberate bump.
        run: |
          GC_VERSION=2.13.1
          curl -sSL "https://github.com/orhun/git-cliff/releases/download/v${GC_VERSION}/git-cliff-${GC_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv git-cliff-*/git-cliff /usr/local/bin/

      - name: Download macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.macos.outputs.artifact-name }}

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.windows.outputs.artifact-name }}
          path: QK4-windows

      - name: Download Raspberry Pi artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.raspberry-pi.outputs.artifact-name }}

      - name: Package Windows release asset
        # WHY here and not in the builder: actions/upload-artifact wraps every upload
        # in its own zip, so the builder ships a plain directory to keep the Actions
        # download a single unwrap. The user-facing asset must be one self-contained
        # file, so the .zip is assembled once, here, for both the Release and Pages.
        run: zip -qr "QK4-${{ needs.version.outputs.version }}-windows.zip" QK4-windows

      - name: Generate release notes
        run: git-cliff --latest --strip header -o release_notes.md

      - name: Generate checksums
        run: |
          sha256sum \
            "QK4-${{ needs.version.outputs.version }}-macos.dmg" \
            "QK4-${{ needs.version.outputs.version }}-windows.zip" \
            "QK4-${{ needs.version.outputs.version }}-raspberry-pi-arm64.tar.gz" \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Rehearsal summary
        if: needs.version.outputs.is_release != 'true'
        run: |
          {
            echo "### Release rehearsal \`${{ needs.version.outputs.version }}\`"
            echo
            echo "All three platforms built, notes generated, checksums computed."
            echo "**No GitHub Release created. gh-pages untouched.**"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hand assembled assets to publish
        # The publish job needs the exact files attached to the Release, including
        # the Windows zip assembled above. Passing them as one artifact keeps that
        # assembly in a single place.
        #
        # Deliberately NOT gated on is_release: uploading during a rehearsal is what
        # makes the assembled assets inspectable before a real tag is ever cut.
        # Publishing stays gated on the publish job itself.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets-${{ needs.version.outputs.version }}
          path: |
            QK4-${{ needs.version.outputs.version }}-macos.dmg
            QK4-${{ needs.version.outputs.version }}-windows.zip
            QK4-${{ needs.version.outputs.version }}-raspberry-pi-arm64.tar.gz
          retention-days: 7

      - name: Create Release
        if: needs.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            QK4-${{ needs.version.outputs.version }}-macos.dmg
            QK4-${{ needs.version.outputs.version }}-windows.zip
            QK4-${{ needs.version.outputs.version }}-raspberry-pi-arm64.tar.gz
            SHA256SUMS.txt
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}

  publish:
    # WHY no job-level is_release gate: everything here except the final push is
    # rehearsable, and releases.json generation is the step most likely to break
    # the download page. Only "Commit and push" is gated, so a dispatch exercises
    # the whole path and publishes nothing.
    needs: [version, macos, windows, raspberry-pi, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: gh-pages

      - name: Download assembled release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-assets-${{ needs.version.outputs.version }}
          path: artifacts

      - name: Stage downloads and generate releases.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
          IS_RELEASE: ${{ needs.version.outputs.is_release }}
        run: |
          set -euo pipefail

          if [ "$IS_RELEASE" = "true" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="rehearsal-${VERSION}"
          fi
          DATE=$(date -u +%Y-%m-%d)

          # Platform table — adding a platform is a data change here, nothing else
          # in this step needs editing. Format: <releases.json key>|<filename>
          PLATFORMS=(
            "macos|QK4-${VERSION}-macos.dmg"
            "windows|QK4-${VERSION}-windows.zip"
            "raspberry-pi|QK4-${VERSION}-raspberry-pi-arm64.tar.gz"
          )

          rm -rf downloads/
          mkdir -p "downloads/$TAG"

          # WHY jq and not a heredoc: a hand-maintained JSON template silently
          # produces invalid JSON on a missing comma, and index.html fails closed —
          # one bad entry takes down every platform's download card.
          ASSETS='{}'
          for entry in "${PLATFORMS[@]}"; do
            KEY="${entry%%|*}"
            FILE="${entry#*|}"

            if [ ! -f "artifacts/$FILE" ]; then
              echo "ERROR: expected release asset missing: artifacts/$FILE"
              exit 1
            fi

            cp "artifacts/$FILE" "downloads/$TAG/"
            SZ=$(du -h "downloads/$TAG/$FILE" | cut -f1 | xargs)
            HASH=$(sha256sum "downloads/$TAG/$FILE" | cut -d' ' -f1)

            ASSETS=$(jq -n \
              --argjson acc "$ASSETS" \
              --arg k "$KEY" --arg n "$FILE" \
              --arg u "./downloads/$TAG/$FILE" \
              --arg s "$SZ" --arg h "$HASH" \
              '$acc + {($k): {name: $n, url: $u, size: $s, sha256: $h}}')
          done

          if echo "$TAG" | grep -qE 'alpha|beta'; then PRERELEASE=true; else PRERELEASE=false; fi

          jq -n \
            --arg tag "$TAG" \
            --arg version "$VERSION" \
            --arg date "$DATE" \
            --argjson prerelease "$PRERELEASE" \
            --argjson assets "$ASSETS" \
            '{tag: $tag, version: $version, date: $date, prerelease: $prerelease, assets: $assets}' \
            > releases.json

          rm -rf artifacts/

      - name: Validate releases.json
        run: |
          set -euo pipefail
          jq empty releases.json || { echo "ERROR: releases.json is not valid JSON"; exit 1; }

          # Every asset must carry the four fields index.html reads, and every
          # referenced file must actually exist under downloads/.
          jq -e 'has("tag") and has("version") and has("date") and has("prerelease")
                 and (.assets | length > 0)' releases.json > /dev/null \
            || { echo "ERROR: releases.json missing required top-level fields"; exit 1; }

          FAIL=0
          for key in $(jq -r '.assets | keys[]' releases.json); do
            jq -e --arg k "$key" '.assets[$k] | has("name") and has("url") and has("size") and has("sha256")' \
              releases.json > /dev/null || { echo "ERROR: asset '$key' missing fields"; FAIL=1; }
            URL=$(jq -r --arg k "$key" '.assets[$k].url' releases.json)
            [ -f "${URL#./}" ] || { echo "ERROR: asset '$key' points at missing file: $URL"; FAIL=1; }
          done
          exit $FAIL

      - name: Rehearsal summary
        if: needs.version.outputs.is_release != 'true'
        run: |
          {
            echo "### gh-pages rehearsal — nothing pushed"
            echo
            echo 'Generated and validated `releases.json`:'
            echo '```json'
            cat releases.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push to gh-pages
        if: needs.version.outputs.is_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release ${{ github.ref_name }}"
          git push
