name: Release

# Tagged release: builds all three platforms via the shared _build-*.yml reusable
# workflows, publishes a GitHub Release, and updates the gh-pages download page.
#
# workflow_dispatch runs the SAME build and packaging path as a rehearsal, then
# stops before Create Release and publish. That makes the release path testable
# without minting a tag or touching gh-pages. A dispatch can never publish —
# publishing is gated on the event being a tag push, not on a user-supplied flag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, never cancelled mid-notarization.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Derive version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.derive.outputs.version }}
      is_release: ${{ steps.derive.outputs.is_release }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Derive version
        id: derive
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IS_RELEASE=true
          else
            VERSION="dryrun-$(git rev-parse --short HEAD)"
            IS_RELEASE=false
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "version=$VERSION is_release=$IS_RELEASE"

  macos:
    needs: version
    uses: ./.github/workflows/_build-macos.yml
    with:
      version: ${{ needs.version.outputs.version }}
      retention-days: 30
    secrets: inherit

  windows:
    needs: version
    uses: ./.github/workflows/_build-windows.yml
    with:
      version: ${{ needs.version.outputs.version }}
      retention-days: 30
    secrets: inherit

  raspberry-pi:
    needs: version
    uses: ./.github/workflows/_build-pi.yml
    with:
      version: ${{ needs.version.outputs.version }}
      retention-days: 30
    secrets: inherit

  release:
    needs: [version, macos, windows, raspberry-pi]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Install git-cliff
        # Pinned so release-notes formatting can't change between releases
        # without a deliberate bump.
        run: |
          GC_VERSION=2.13.1
          curl -sSL "https://github.com/orhun/git-cliff/releases/download/v${GC_VERSION}/git-cliff-${GC_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv git-cliff-*/git-cliff /usr/local/bin/

      - name: Download macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.macos.outputs.artifact-name }}

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.windows.outputs.artifact-name }}

      - name: Download Raspberry Pi artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.raspberry-pi.outputs.artifact-name }}

      - name: Generate release notes
        run: git-cliff --latest --strip header -o release_notes.md

      - name: Generate checksums
        run: |
          sha256sum \
            "QK4-${{ needs.version.outputs.version }}-macos.dmg" \
            "QK4-${{ needs.version.outputs.version }}-windows.zip" \
            "QK4-${{ needs.version.outputs.version }}-raspberry-pi-arm64.tar.gz" \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Rehearsal summary
        if: needs.version.outputs.is_release != 'true'
        run: |
          {
            echo "### Release rehearsal \`${{ needs.version.outputs.version }}\`"
            echo
            echo "All three platforms built, notes generated, checksums computed."
            echo "**No GitHub Release created. gh-pages untouched.**"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create Release
        if: needs.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            QK4-${{ needs.version.outputs.version }}-macos.dmg
            QK4-${{ needs.version.outputs.version }}-windows.zip
            QK4-${{ needs.version.outputs.version }}-raspberry-pi-arm64.tar.gz
            SHA256SUMS.txt
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}

  publish:
    needs: [version, macos, windows, raspberry-pi, release]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: gh-pages

      - name: Download macOS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.macos.outputs.artifact-name }}
          path: artifacts/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.windows.outputs.artifact-name }}
          path: artifacts/windows

      - name: Download Raspberry Pi artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.raspberry-pi.outputs.artifact-name }}
          path: artifacts/raspberry-pi

      - name: Update downloads and releases.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${{ needs.version.outputs.version }}"
          DATE=$(date -u +%Y-%m-%d)
          MAC_DMG="QK4-${VERSION}-macos.dmg"
          WIN_ZIP="QK4-${VERSION}-windows.zip"
          PI_TGZ="QK4-${VERSION}-raspberry-pi-arm64.tar.gz"

          # Remove old downloads, add new
          rm -rf downloads/
          mkdir -p "downloads/$TAG"
          cp artifacts/macos/$MAC_DMG "downloads/$TAG/"
          cp artifacts/windows/$WIN_ZIP "downloads/$TAG/"
          cp artifacts/raspberry-pi/$PI_TGZ "downloads/$TAG/"

          # Compute human-readable sizes
          SZ_MAC=$(du -h "downloads/$TAG/$MAC_DMG" | cut -f1 | xargs)
          SZ_WIN=$(du -h "downloads/$TAG/$WIN_ZIP" | cut -f1 | xargs)
          SZ_PI=$(du -h "downloads/$TAG/$PI_TGZ" | cut -f1 | xargs)

          # Compute SHA256 hashes
          HASH_MAC=$(sha256sum "downloads/$TAG/$MAC_DMG" | cut -d' ' -f1)
          HASH_WIN=$(sha256sum "downloads/$TAG/$WIN_ZIP" | cut -d' ' -f1)
          HASH_PI=$(sha256sum "downloads/$TAG/$PI_TGZ" | cut -d' ' -f1)

          # Detect prerelease
          if echo "$TAG" | grep -qE 'alpha|beta'; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          # Build releases.json
          cat > releases.json <<EOF
          {
            "tag": "$TAG",
            "version": "$VERSION",
            "date": "$DATE",
            "prerelease": $PRERELEASE,
            "assets": {
              "macos": {
                "name": "$MAC_DMG",
                "url": "./downloads/$TAG/$MAC_DMG",
                "size": "$SZ_MAC",
                "sha256": "$HASH_MAC"
              },
              "windows": {
                "name": "$WIN_ZIP",
                "url": "./downloads/$TAG/$WIN_ZIP",
                "size": "$SZ_WIN",
                "sha256": "$HASH_WIN"
              },
              "raspberry-pi": {
                "name": "$PI_TGZ",
                "url": "./downloads/$TAG/$PI_TGZ",
                "size": "$SZ_PI",
                "sha256": "$HASH_PI"
              }
            }
          }
          EOF

          # Clean up artifacts directory
          rm -rf artifacts/

      - name: Commit and push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release ${{ github.ref_name }}"
          git push
